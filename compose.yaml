name: smartrent
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-smartrent}
      MYSQL_USER: ${DB_USER:-smartrent}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  server:
    build: ./server
    command: ["sh", "-c", "npm run db:migrate && npm start"]
    volumes:
      - ./database:/database:ro
    environment:
      NODE_ENV: development
      DATABASE_DIR: /database
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-smartrent}
      DB_USER: ${DB_USER:-smartrent}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      CLIENT_ORIGIN: http://localhost:${CLIENT_PORT:-5173}
    ports:
      - "127.0.0.1:${SERVER_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
  client:
    build: ./client
    environment:
      API_PROXY_TARGET: http://server:3000
    ports:
      - "127.0.0.1:${CLIENT_PORT:-5173}:5173"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
  test-db:
    image: mysql:8.4
    profiles: [test]
    environment:
      MYSQL_DATABASE: smartrent_test
      MYSQL_USER: smartrent_test
      MYSQL_PASSWORD: isolated_test_only
      MYSQL_ROOT_PASSWORD: isolated_root_test_only
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 20s
  test:
    build: ./server
    profiles: [test]
    command: npm run test:integration
    volumes:
      - ./database:/database:ro
    environment:
      NODE_ENV: test
      DATABASE_DIR: /database
      DB_HOST: test-db
      DB_PORT: 3306
      DB_NAME: smartrent_test
      DB_USER: smartrent_test
      DB_PASSWORD: isolated_test_only
    depends_on:
      test-db:
        condition: service_healthy
volumes:
  mysql_data:
